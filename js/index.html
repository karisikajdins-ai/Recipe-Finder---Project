<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mat Guiden</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Välkommen till Mat Guiden!</h1>
  <p>Sök recept och upptäck nya maträtter!</p>
</header>

<main>
  <section class="search-section">
    <input type="text" id="searchInput" placeholder="Sök mat efter namn eller ingrediens...">
    <button id="searchBtn">Sök</button>
  </section>

  <section id="results" class="results-grid"></section>

  <section id="mealDetails" class="meal-details hidden"></section>
</main>

<script src="script.js"></script>
</body>
</html>
